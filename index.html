<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8f1ed">
  <title>Happy Birthday Goosey</title>
  <style>
    :root {
      --paper: #f8fbf9;
      --mint: #dcece4;
      --ink: #303438;
      --muted: #62716a;
      --edge: rgba(45, 64, 55, .16);
      --shadow: rgba(35, 50, 43, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 18%, rgba(255,255,255,.92), transparent 28%),
        radial-gradient(circle at 78% 82%, rgba(255,255,255,.60), transparent 30%),
        #e7f0ec;
      color: var(--ink);
      font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    }

    button {
      font: inherit;
    }

    #viewer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: default;
    }

    #viewer.open {
      cursor: grab;
    }

    #viewer.dragging {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 2586px;
      height: 2048px;
      transform-origin: 0 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .page {
      position: absolute;
      top: 0;
      width: 1293px;
      height: 2048px;
      border: 1px solid var(--edge);
      background: var(--paper);
    }

    #rightPage {
      left: 1293px;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 18%, rgba(207,231,219,.65), transparent 30%),
        radial-gradient(circle at 82% 74%, rgba(214,235,225,.68), transparent 31%),
        linear-gradient(180deg, #fbfdfc, #f3f8f5);
    }

    #message {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 10%;
      text-align: center;
      position: relative;
    }

    #messageText {
      max-width: 90%;
      font-size: 155px;
      line-height: 1.04;
      letter-spacing: .015em;
      text-transform: uppercase;
      transform: rotate(-1deg);
    }

    #messageText span {
      display: block;
      margin-top: .14em;
      font-size: 1.08em;
    }

    .doodle {
      position: absolute;
      color: #74a985;
      opacity: .55;
      font-size: 80px;
    }

    .d1 { top: 10%; left: 12%; transform: rotate(-14deg); }
    .d2 { right: 12%; bottom: 11%; transform: rotate(19deg); }
    .d3 { left: 14%; bottom: 12%; font-size: 66px; opacity: .35; }

    #cover {
      position: absolute;
      left: 1293px;
      top: 0;
      width: 1293px;
      height: 2048px;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1050ms cubic-bezier(.18,.74,.22,1);
      z-index: 10;
    }

    #cover.open {
      transform: rotateY(-180deg);
    }

    .coverSide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid var(--edge);
    }

    #coverFront {
      background: #fff;
      box-shadow: 0 34px 65px var(--shadow);
    }

    #coverFront img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain; /* never crop */
      object-position: center;
    }

    #coverBack {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 70% 20%, rgba(205,230,218,.67), transparent 28%),
        radial-gradient(circle at 28% 76%, rgba(217,235,226,.72), transparent 30%),
        linear-gradient(180deg, #fbfdfc, #f3f8f5);
      display: grid;
      place-items: center;
    }

    #coverBack .smallMark {
      font-size: 110px;
      color: #759d82;
      opacity: .30;
      transform: rotate(-8deg);
    }

    #openHint {
      position: fixed;
      left: 50%;
      top: max(16px, env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 30;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(55,75,66,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font: 600 13px/1.2 system-ui, sans-serif;
      letter-spacing: .04em;
      color: #52625a;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    #toolbar {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(16px);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px;
      max-width: calc(100vw - 20px);
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(55,75,66,.12);
      box-shadow: 0 12px 34px rgba(35,50,43,.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      font-family: system-ui, sans-serif;
    }

    #viewer.open + #toolbar {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .toolBtn {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #405149;
      font: 650 15px/1 system-ui, sans-serif;
      cursor: pointer;
    }

    .toolBtn:hover {
      background: rgba(89,128,104,.10);
    }

    .toolBtn:focus-visible {
      outline: 3px solid rgba(89,128,104,.32);
      outline-offset: 1px;
    }

    #zoomLabel {
      min-width: 58px;
      text-align: center;
      color: #586760;
      font: 650 13px/1 system-ui, sans-serif;
    }

    #instructions {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      top: max(14px, env(safe-area-inset-top));
      z-index: 35;
      max-width: min(280px, calc(100vw - 28px));
      padding: 10px 12px;
      border-radius: 13px;
      background: rgba(255,255,255,.80);
      border: 1px solid rgba(55,75,66,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #596860;
      font: 500 12px/1.35 system-ui, sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    #viewer.open ~ #instructions {
      opacity: .88;
    }

    @media (max-width: 640px) {
      #instructions {
        top: auto;
        right: 50%;
        bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px);
        transform: translateX(50%);
        width: max-content;
        max-width: calc(100vw - 24px);
        text-align: center;
      }

      #messageText {
        font-size: 142px;
      }

      .toolBtn {
        min-width: 38px;
        height: 38px;
        padding: 0 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #cover {
        transition-duration: 1ms;
      }
    }
  </style>
</head>
<body>
  <div id="openHint">Tap the card to open</div>

  <main id="viewer" aria-label="Interactive birthday card viewer">
    <div id="world">
      <section id="rightPage" class="page" aria-label="Inside right page">
        <div id="message">
          <div class="doodle d1">✦</div>
          <div class="doodle d2">✦</div>
          <div class="doodle d3">♡</div>
          <div id="messageText">
            Happy Birthday
            <span>Goosey</span>
          </div>
        </div>
      </section>

      <section id="cover" role="button" aria-label="Open birthday card">
        <div id="coverFront" class="coverSide">
          <img
            src="cover.gif"
            width="1293"
            height="2048"
            alt="Animated Happy Silly Goosey Birthday cover"
            draggable="false">
        </div>
        <div id="coverBack" class="coverSide" aria-hidden="true">
          <div class="smallMark">♡</div>
        </div>
      </section>
    </div>
  </main>

  <nav id="toolbar" aria-label="Card viewing controls">
    <button class="toolBtn" id="zoomOut" type="button" aria-label="Zoom out">−</button>
    <div id="zoomLabel" aria-live="polite">100%</div>
    <button class="toolBtn" id="zoomIn" type="button" aria-label="Zoom in">+</button>
    <button class="toolBtn" id="fit" type="button">Fit</button>
    <button class="toolBtn" id="close" type="button">Close</button>
  </nav>

  <div id="instructions">
    Drag to pan · wheel or pinch to zoom
  </div>

  <script>
    (() => {
      const CARD_W = 1293;
      const CARD_H = 2048;
      const OPEN_W = CARD_W * 2;
      const MIN_ZOOM = 0.45;
      const MAX_ZOOM = 5;

      const viewer = document.getElementById('viewer');
      const world = document.getElementById('world');
      const cover = document.getElementById('cover');
      const hint = document.getElementById('openHint');
      const zoomOut = document.getElementById('zoomOut');
      const zoomIn = document.getElementById('zoomIn');
      const fitBtn = document.getElementById('fit');
      const closeBtn = document.getElementById('close');
      const zoomLabel = document.getElementById('zoomLabel');

      let isOpen = false;
      let zoom = 1;
      let panX = 0;
      let panY = 0;
      let fitScale = 1;

      const pointers = new Map();
      let dragStart = null;
      let pinchStart = null;

      function getPadding() {
        const narrow = window.innerWidth < 640;
        return narrow ? 18 : 40;
      }

      function computeFitScale() {
        const pad = getPadding();
        const vw = viewer.clientWidth;
        const vh = viewer.clientHeight;
        const targetW = isOpen ? OPEN_W : CARD_W;
        const targetH = CARD_H;
        return Math.min(
          (vw - pad * 2) / targetW,
          (vh - pad * 2) / targetH
        );
      }

      function render() {
        fitScale = computeFitScale();
        const s = fitScale * zoom;
        const vw = viewer.clientWidth;
        const vh = viewer.clientHeight;

        let baseX, baseY;
        if (isOpen) {
          baseX = (vw - OPEN_W * s) / 2;
          baseY = (vh - CARD_H * s) / 2;
        } else {
          // Center ONLY the right-hand page while the left half stays off-screen.
          baseX = (vw - CARD_W * s) / 2 - CARD_W * s;
          baseY = (vh - CARD_H * s) / 2;
        }

        world.style.transform =
          `translate3d(${baseX + panX}px, ${baseY + panY}px, 0) scale(${s})`;

        zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
      }

      function openCard() {
        if (isOpen) return;
        isOpen = true;
        zoom = 1;
        panX = 0;
        panY = 0;
        viewer.classList.add('open');
        cover.classList.add('open');
        cover.removeAttribute('role');
        hint.style.opacity = '0';
        render();
      }

      function closeCard() {
        isOpen = false;
        zoom = 1;
        panX = 0;
        panY = 0;
        viewer.classList.remove('open', 'dragging');
        cover.classList.remove('open');
        cover.setAttribute('role', 'button');
        hint.style.opacity = '1';
        pointers.clear();
        render();
      }

      function setZoom(newZoom, clientX = viewer.clientWidth / 2, clientY = viewer.clientHeight / 2) {
        if (!isOpen) return;

        newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
        if (Math.abs(newZoom - zoom) < 0.0001) return;

        const vw = viewer.clientWidth;
        const vh = viewer.clientHeight;

        const oldScale = fitScale * zoom;
        const oldBaseX = (vw - OPEN_W * oldScale) / 2;
        const oldBaseY = (vh - CARD_H * oldScale) / 2;

        const worldX = (clientX - oldBaseX - panX) / oldScale;
        const worldY = (clientY - oldBaseY - panY) / oldScale;

        zoom = newZoom;
        fitScale = computeFitScale();
        const newScale = fitScale * zoom;
        const newBaseX = (vw - OPEN_W * newScale) / 2;
        const newBaseY = (vh - CARD_H * newScale) / 2;

        panX = clientX - newBaseX - worldX * newScale;
        panY = clientY - newBaseY - worldY * newScale;

        render();
      }

      function fitCard() {
        if (!isOpen) return;
        zoom = 1;
        panX = 0;
        panY = 0;
        render();
      }

      cover.addEventListener('click', (e) => {
        if (!isOpen) {
          e.stopPropagation();
          openCard();
        }
      });

      viewer.addEventListener('wheel', (e) => {
        if (!isOpen) return;
        e.preventDefault();
        const factor = Math.exp(-e.deltaY * 0.0015);
        setZoom(zoom * factor, e.clientX, e.clientY);
      }, { passive: false });

      viewer.addEventListener('pointerdown', (e) => {
        if (!isOpen) return;
        if (e.target.closest('#toolbar')) return;

        viewer.setPointerCapture?.(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 1) {
          dragStart = {
            x: e.clientX,
            y: e.clientY,
            panX,
            panY
          };
          viewer.classList.add('dragging');
        } else if (pointers.size === 2) {
          const pts = [...pointers.values()];
          const dx = pts[1].x - pts[0].x;
          const dy = pts[1].y - pts[0].y;
          pinchStart = {
            distance: Math.hypot(dx, dy),
            zoom,
            centerX: (pts[0].x + pts[1].x) / 2,
            centerY: (pts[0].y + pts[1].y) / 2
          };
          dragStart = null;
        }
      });

      viewer.addEventListener('pointermove', (e) => {
        if (!isOpen || !pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 1 && dragStart) {
          panX = dragStart.panX + (e.clientX - dragStart.x);
          panY = dragStart.panY + (e.clientY - dragStart.y);
          render();
        } else if (pointers.size === 2 && pinchStart) {
          const pts = [...pointers.values()];
          const dx = pts[1].x - pts[0].x;
          const dy = pts[1].y - pts[0].y;
          const distance = Math.hypot(dx, dy);
          const centerX = (pts[0].x + pts[1].x) / 2;
          const centerY = (pts[0].y + pts[1].y) / 2;
          const ratio = distance / Math.max(1, pinchStart.distance);

          setZoom(pinchStart.zoom * ratio, centerX, centerY);
        }
      });

      function endPointer(e) {
        pointers.delete(e.pointerId);

        if (pointers.size === 0) {
          dragStart = null;
          pinchStart = null;
          viewer.classList.remove('dragging');
        } else if (pointers.size === 1) {
          const [p] = pointers.values();
          dragStart = { x: p.x, y: p.y, panX, panY };
          pinchStart = null;
        }
      }

      viewer.addEventListener('pointerup', endPointer);
      viewer.addEventListener('pointercancel', endPointer);

      zoomIn.addEventListener('click', () => setZoom(zoom * 1.22));
      zoomOut.addEventListener('click', () => setZoom(zoom / 1.22));
      fitBtn.addEventListener('click', fitCard);
      closeBtn.addEventListener('click', closeCard);

      document.addEventListener('keydown', (e) => {
        if (!isOpen) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openCard();
          }
          return;
        }

        if (e.key === '+' || e.key === '=') {
          e.preventDefault();
          setZoom(zoom * 1.22);
        } else if (e.key === '-' || e.key === '_') {
          e.preventDefault();
          setZoom(zoom / 1.22);
        } else if (e.key === '0') {
          e.preventDefault();
          fitCard();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeCard();
        } else if (e.key.startsWith('Arrow')) {
          e.preventDefault();
          const step = 36;
          if (e.key === 'ArrowLeft') panX += step;
          if (e.key === 'ArrowRight') panX -= step;
          if (e.key === 'ArrowUp') panY += step;
          if (e.key === 'ArrowDown') panY -= step;
          render();
        }
      });

      window.addEventListener('resize', () => {
        if (!isOpen) {
          panX = 0;
          panY = 0;
          zoom = 1;
        }
        render();
      });

      render();
    })();
  </script>
</body>
</html>
