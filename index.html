<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Happy Birthday Goosey</title>
<style>
:root {
  --ink:#303437;
  --paper:#f9fcfa;
  --mint:#e5f0eb;
  --line:rgba(46,64,55,.15);
}
* { box-sizing:border-box; }
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#e8f1ed;
  color:var(--ink);
}
body {
  font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
}
button { font:inherit; }

#stage {
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.95), transparent 28%),
    radial-gradient(circle at 82% 80%, rgba(255,255,255,.60), transparent 28%),
    #e7f0ec;
}

#camera {
  position:absolute;
  left:0;
  top:0;
  transform-origin:0 0;
  will-change:transform;
}

#spread {
  position:relative;
  display:flex;
  width:2586px;
  height:2048px;
  transform-style:preserve-3d;
}

.page {
  width:1293px;
  height:2048px;
  flex:none;
  border:1px solid var(--line);
  background:var(--paper);
  overflow:hidden;
}

#leftInside {
  background:
    radial-gradient(circle at 65% 18%, rgba(213,235,224,.8), transparent 28%),
    radial-gradient(circle at 27% 76%, rgba(222,239,231,.8), transparent 30%),
    var(--paper);
  display:grid;
  place-items:center;
}

#leftInside .heart {
  font-size:120px;
  opacity:.25;
  color:#6e9d7d;
  transform:rotate(-8deg);
}

#rightInside {
  background:
    radial-gradient(circle at 20% 18%, rgba(212,234,223,.72), transparent 28%),
    radial-gradient(circle at 82% 78%, rgba(217,237,227,.74), transparent 30%),
    var(--paper);
  position:relative;
  display:grid;
  place-items:center;
  padding:9%;
  text-align:center;
}

#message {
  font-size:150px;
  line-height:1.04;
  text-transform:uppercase;
  letter-spacing:.01em;
  transform:rotate(-1deg);
}
#message span {
  display:block;
  margin-top:.12em;
  font-size:1.08em;
}
.spark {
  position:absolute;
  color:#76aa87;
  font-size:72px;
  opacity:.55;
}
.s1 { left:12%; top:10%; transform:rotate(-15deg); }
.s2 { right:12%; bottom:10%; transform:rotate(18deg); }

#cover {
  position:absolute;
  left:1293px;
  top:0;
  width:1293px;
  height:2048px;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 1.05s cubic-bezier(.2,.74,.2,1);
  z-index:10;
  cursor:pointer;
}

#cover.open {
  transform:rotateY(-180deg);
}

.coverFace {
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border:1px solid var(--line);
  overflow:hidden;
}

#coverFront {
  background:#fff;
}

#coverFront img {
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  object-position:center;
}

#coverBack {
  transform:rotateY(180deg);
  background:
    radial-gradient(circle at 65% 20%, rgba(211,234,223,.78), transparent 27%),
    radial-gradient(circle at 30% 78%, rgba(220,238,229,.78), transparent 30%),
    var(--paper);
  display:grid;
  place-items:center;
}
#coverBack span {
  font-size:120px;
  opacity:.22;
  color:#6f9f7e;
}

#openHint {
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  padding:9px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(48,70,60,.10);
  font:600 13px/1.2 system-ui,sans-serif;
  color:#526159;
  backdrop-filter:blur(10px);
  pointer-events:none;
  transition:opacity .25s;
}

#controls {
  position:fixed;
  z-index:40;
  left:50%;
  bottom:18px;
  transform:translateX(-50%) translateY(15px);
  display:flex;
  gap:6px;
  align-items:center;
  padding:7px;
  border-radius:999px;
  background:rgba(255,255,255,.93);
  border:1px solid rgba(48,70,60,.12);
  box-shadow:0 10px 30px rgba(35,50,43,.14);
  backdrop-filter:blur(12px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-family:system-ui,sans-serif;
}

body.open #controls {
  opacity:1;
  pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}

.ctrl {
  border:0;
  background:transparent;
  min-width:42px;
  height:40px;
  padding:0 12px;
  border-radius:999px;
  color:#405048;
  font:650 14px/1 system-ui,sans-serif;
  cursor:pointer;
}
.ctrl:hover { background:rgba(90,130,106,.10); }
#pct {
  min-width:56px;
  text-align:center;
  font:650 13px/1 system-ui,sans-serif;
  color:#596760;
}

#help {
  position:fixed;
  left:50%;
  bottom:76px;
  transform:translateX(-50%);
  z-index:35;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(48,70,60,.10);
  color:#596760;
  font:600 12px/1.2 system-ui,sans-serif;
  backdrop-filter:blur(10px);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s;
  white-space:nowrap;
}
body.open #help { opacity:.92; }

body.open #stage { cursor:grab; }
body.dragging #stage { cursor:grabbing; }

@media(max-width:640px) {
  #help {
    max-width:calc(100vw - 24px);
    white-space:normal;
    text-align:center;
  }
}

@media(prefers-reduced-motion:reduce) {
  #cover { transition-duration:1ms; }
}
</style>
</head>
<body>
<div id="openHint">Tap the card to open</div>

<div id="stage" aria-label="Interactive birthday card">
  <div id="camera">
    <div id="spread">
      <section id="leftInside" class="page" aria-label="Left inside page">
        <div class="heart">♡</div>
      </section>

      <section id="rightInside" class="page" aria-label="Right inside page">
        <div class="spark s1">✦</div>
        <div class="spark s2">✦</div>
        <div id="message">Happy Birthday<span>Goosey</span></div>
      </section>

      <div id="cover" role="button" aria-label="Open card">
        <div id="coverFront" class="coverFace">
          <img src="goosey-cover-v3.gif?v=3" alt="Animated Happy Silly Goosey Birthday cover" draggable="false">
        </div>
        <div id="coverBack" class="coverFace"><span>♡</span></div>
      </div>
    </div>
  </div>
</div>

<div id="help">Drag to pan · wheel/trackpad or pinch to zoom</div>

<nav id="controls" aria-label="Zoom and card controls">
  <button class="ctrl" id="minus" type="button" aria-label="Zoom out">−</button>
  <div id="pct">100%</div>
  <button class="ctrl" id="plus" type="button" aria-label="Zoom in">+</button>
  <button class="ctrl" id="fit" type="button">Fit</button>
  <button class="ctrl" id="close" type="button">Close</button>
</nav>

<script>
(() => {
  const W=1293, H=2048, OPEN_W=2586;
  const stage=document.getElementById('stage');
  const camera=document.getElementById('camera');
  const cover=document.getElementById('cover');
  const hint=document.getElementById('openHint');
  const pct=document.getElementById('pct');

  let open=false;
  let zoom=1;
  let panX=0, panY=0;
  let fitScale=1;
  const pointers=new Map();
  let dragStart=null;
  let pinchStart=null;

  function fitFor(openState=open) {
    const pad=window.innerWidth<640 ? 18 : 36;
    const targetW=openState ? OPEN_W : W;
    return Math.min(
      (stage.clientWidth-pad*2)/targetW,
      (stage.clientHeight-pad*2)/H
    );
  }

  function render() {
    fitScale=fitFor();
    const s=fitScale*zoom;
    const vw=stage.clientWidth, vh=stage.clientHeight;
    const targetW=open ? OPEN_W : W;

    let x=(vw-targetW*s)/2;
    let y=(vh-H*s)/2;

    // Closed: only show the right-hand cover, centered in the viewport.
    if(!open) x -= W*s;

    camera.style.transform=`translate3d(${x+panX}px,${y+panY}px,0) scale(${s})`;
    pct.textContent=`${Math.round(zoom*100)}%`;
  }

  function openCard() {
    if(open) return;
    open=true;
    zoom=1; panX=0; panY=0;
    cover.classList.add('open');
    document.body.classList.add('open');
    hint.style.opacity='0';
    setTimeout(render, 40);
  }

  function closeCard() {
    open=false;
    zoom=1; panX=0; panY=0;
    cover.classList.remove('open');
    document.body.classList.remove('open','dragging');
    hint.style.opacity='1';
    pointers.clear();
    render();
  }

  function zoomAt(next,cx=stage.clientWidth/2,cy=stage.clientHeight/2) {
    if(!open) return;
    next=Math.max(.45,Math.min(5,next));

    const oldS=fitScale*zoom;
    const oldBaseX=(stage.clientWidth-OPEN_W*oldS)/2;
    const oldBaseY=(stage.clientHeight-H*oldS)/2;
    const wx=(cx-oldBaseX-panX)/oldS;
    const wy=(cy-oldBaseY-panY)/oldS;

    zoom=next;
    fitScale=fitFor();
    const newS=fitScale*zoom;
    const newBaseX=(stage.clientWidth-OPEN_W*newS)/2;
    const newBaseY=(stage.clientHeight-H*newS)/2;

    panX=cx-newBaseX-wx*newS;
    panY=cy-newBaseY-wy*newS;
    render();
  }

  function fit() {
    if(!open) return;
    zoom=1; panX=0; panY=0;
    render();
  }

  cover.addEventListener('click',e=>{
    if(!open) {
      e.stopPropagation();
      openCard();
    }
  });

  stage.addEventListener('wheel',e=>{
    if(!open) return;
    e.preventDefault();
    const factor=Math.exp(-e.deltaY*0.0015);
    zoomAt(zoom*factor,e.clientX,e.clientY);
  },{passive:false});

  stage.addEventListener('pointerdown',e=>{
    if(!open) return;
    stage.setPointerCapture?.(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

    if(pointers.size===1) {
      dragStart={x:e.clientX,y:e.clientY,panX,panY};
      document.body.classList.add('dragging');
    } else if(pointers.size===2) {
      const p=[...pointers.values()];
      const dx=p[1].x-p[0].x, dy=p[1].y-p[0].y;
      pinchStart={
        dist:Math.hypot(dx,dy),
        zoom,
        cx:(p[0].x+p[1].x)/2,
        cy:(p[0].y+p[1].y)/2
      };
      dragStart=null;
    }
  });

  stage.addEventListener('pointermove',e=>{
    if(!open || !pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

    if(pointers.size===1 && dragStart) {
      panX=dragStart.panX+(e.clientX-dragStart.x);
      panY=dragStart.panY+(e.clientY-dragStart.y);
      render();
    } else if(pointers.size===2 && pinchStart) {
      const p=[...pointers.values()];
      const dx=p[1].x-p[0].x, dy=p[1].y-p[0].y;
      const d=Math.hypot(dx,dy);
      const cx=(p[0].x+p[1].x)/2;
      const cy=(p[0].y+p[1].y)/2;
      zoomAt(pinchStart.zoom*(d/Math.max(1,pinchStart.dist)),cx,cy);
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if(pointers.size===0) {
      dragStart=null;
      pinchStart=null;
      document.body.classList.remove('dragging');
    } else if(pointers.size===1) {
      const p=[...pointers.values()][0];
      dragStart={x:p.x,y:p.y,panX,panY};
      pinchStart=null;
    }
  }

  stage.addEventListener('pointerup',endPointer);
  stage.addEventListener('pointercancel',endPointer);

  document.getElementById('plus').addEventListener('click',()=>zoomAt(zoom*1.25));
  document.getElementById('minus').addEventListener('click',()=>zoomAt(zoom/1.25));
  document.getElementById('fit').addEventListener('click',fit);
  document.getElementById('close').addEventListener('click',closeCard);

  document.addEventListener('keydown',e=>{
    if(!open && (e.key==='Enter'||e.key===' ')) {
      e.preventDefault(); openCard(); return;
    }
    if(!open) return;
    if(e.key==='Escape') closeCard();
    if(e.key==='+'||e.key==='=') zoomAt(zoom*1.25);
    if(e.key==='-'||e.key==='_') zoomAt(zoom/1.25);
    if(e.key==='0') fit();
  });

  window.addEventListener('resize',render);
  render();
})();
</script>
</body>
</html>
